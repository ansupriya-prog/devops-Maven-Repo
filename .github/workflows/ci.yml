name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn test

  deploy-staging:
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Docker Compose config
        id: compose
        run: |
          if [ -f docker-compose.yml ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "docker-compose.yml not found, skipping deploy"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Staging Container
        if: steps.compose.outputs.found == 'true'
        run: |
          echo "Approval granted! Deploying to staging stack..."
          docker compose up -d
